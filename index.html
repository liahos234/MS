<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Red Card - Action & Impact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 50%, #090d16 100%); color: #f8fafc; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); perspective: 1000px; }
        .red-glow { border-color: rgba(239, 68, 68, 0.6); box-shadow: 0 0 45px -5px rgba(239, 68, 68, 0.5), inset 0 0 20px rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="card" class="glass-card red-glow rounded-3xl p-6 sm:p-8 flex flex-col justify-between max-w-lg w-full relative overflow-hidden transition-all duration-300">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-rose-500 to-red-600"></div>
        <div>
            <div class="flex justify-between items-center mb-6">
                <span class="px-3 py-1 bg-rose-500/10 border border-rose-500/30 text-rose-400 font-extrabold text-xs uppercase tracking-wider rounded-lg flex items-center space-x-1.5">
                    <i class="fa-solid fa-bolt text-rose-500"></i><span>Action & Impact</span>
                </span>
                <i class="fa-solid fa-trophy text-2xl text-rose-400"></i>
            </div>
            <h2 class="text-xl sm:text-2xl font-black text-white uppercase mb-2">YOU NEED TO FAIL TO KNOW YOUR LIMIT</h2>
            <p class="text-xs font-bold text-rose-400 uppercase mb-6">Pushing Beyond Physical & Mental Capacity</p>
            <div class="bg-slate-950/60 rounded-2xl p-5 border border-rose-500/20 mb-6">
                <ul class="text-xs sm:text-sm text-slate-300 space-y-3 font-medium">
                    <li class="flex items-start space-x-2.5"><i class="fa-solid fa-water text-rose-400 mt-0.5"></i><span>Rowing the Atlantic Ocean against extreme friction.</span></li>
                    <li class="flex items-start space-x-2.5"><i class="fa-solid fa-fire text-rose-400 mt-0.5"></i><span>Embracing high-risk failure to discover true capabilities.</span></li>
                    <li class="flex items-start space-x-2.5"><i class="fa-solid fa-gauge-high text-rose-400 mt-0.5"></i><span>Unlocking peak human output and physical grit.</span></li>
                </ul>
            </div>
        </div>
        <a href="https://youtu.be/DnAfkWlxyv0?si=sWkLZoI4gGlLDwrv" target="_blank" class="w-full py-4 px-6 rounded-xl bg-gradient-to-r from-rose-600 to-red-600 text-white font-extrabold text-xs sm:text-sm flex items-center justify-center space-x-2 shadow-lg shadow-rose-600/30">
            <i class="fa-solid fa-play text-xs"></i><span>WATCH THE VIDEO</span>
        </a>
    </div>
</body>
</html>
